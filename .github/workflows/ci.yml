# The shared workflows are copies of spooq/workflows@automerge-batch (shared-*.yml): a public repository cannot call a private one.
name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  ci:
    uses: ./.github/workflows/shared-ci.yml
    with:
      runner: '"ubuntu-latest"'
      gate-command: python tools/gates.py
      browser: false
    permissions:
      contents: read
      pull-requests: write
      actions: write
    secrets: inherit
